name: Deploy to Kubernetes

on:
  push:
    branches:
      - develop  # Esto se ejecutará cuando haya un push en la rama develop

jobs:
  deploy-k8:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout the repository
        uses: actions/checkout@v3

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build and push Docker image
      - name: Build and push Docker image
        run: |
          docker build -t jesusramirezgamarra/backend-dynamic-db:latest .
          docker push jesusramirezgamarra/backend-dynamic-db:latest

      # 5. Set up Kubernetes (use base64 encoded kubeconfig)
      - name: Set up Kubernetes using kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.CLUSTER_KUBE_CONFIG_K8 }}" | base64 -d > $HOME/.kube/config
        env:
          CLUSTER_KUBE_CONFIG_K8: ${{ secrets.CLUSTER_KUBE_CONFIG_K8 }}

      # 6. Verify Kubernetes context
      - name: Verify current Kubernetes context
        run: |
          kubectl config current-context

      - name: List Kubernetes contexts
        run: |
          kubectl config get-contexts


      # 7. Verify Kubernetes namespaces
      - name: Check namespaces
        run: |
          kubectl get namespaces

      # 8. Deploy all Kubernetes resources in a single apply command
      - name: Deploy all Kubernetes resources
        run: |
          kubectl apply -f k8s/deploy-sk8.yaml

      # 9. Verify deployment in the correct namespace
      - name: Verify deployment
        run: |
          kubectl get pods -n backend-namespace-jesusramirez
          kubectl get svc -n backend-namespace-jesusramirez
