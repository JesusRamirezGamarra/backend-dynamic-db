name: Deploy Backend to Kubernetes

on:
  push:
    branches:
      - develop  # 🚀 Se ejecutará cuando haya cambios en la rama "develop"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar `expect`
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Configurar SSH y conectar al servidor con `expect`
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -t rsa 204.48.22.13 >> ~/.ssh/known_hosts

      - name: Probar conexión SSH con `expect`
        run: |
          expect <<EOF
          spawn ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@204.48.22.13 "echo Conexión exitosa!"
          expect "Enter passphrase for key"
          send "${{ secrets.SSH_PASSPHRASE }}\r"
          expect eof
          EOF

      - name: Crear directorios en el servidor si no existen
        run: |
          expect <<EOF
          spawn ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@204.48.22.13
          expect "Enter passphrase for key"
          send "${{ secrets.SSH_PASSPHRASE }}\r"
          expect "#"
          send "mkdir -p /root/codigo/jesusramirez/backend-dynamic-db/k8s\r"
          send "mkdir -p /root/codigo/jesusramirez/docker\r"
          send "exit\r"
          expect eof
          EOF

      - name: Sincronizar archivos Kubernetes con el servidor usando `expect`
        run: |
          expect <<EOF
          spawn rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" ./k8s/ root@204.48.22.13:/root/codigo/jesusramirez/backend-dynamic-db/k8s
          expect "Enter passphrase for key"
          send "${{ secrets.SSH_PASSPHRASE }}\r"
          expect eof
          EOF

      - name: Sincronizar nuevo `docker-compose.yml` con el servidor
        run: |
          expect <<EOF
          spawn rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" ./docker-compose.yml root@204.48.22.13:/root/codigo/jesusramirez/docker/docker-compose.yml
          expect "Enter passphrase for key"
          send "${{ secrets.SSH_PASSPHRASE }}\r"
          expect eof
          EOF

      - name: Desplegar en Kubernetes en Digital Ocean con `expect`
        run: |
          expect <<EOF
          spawn ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@204.48.22.13
          expect "Enter passphrase for key"
          send "${{ secrets.SSH_PASSPHRASE }}\r"
          expect "#"
          send "set -e\r"
          send "cd /root/codigo/jesusramirez/backend-dynamic-db/k8s\r"
          send "kubectl apply -f namespace.yaml\r"
          send "kubectl apply -f configmap.yaml -n backend-namespace-jesusramirez\r"
          send "kubectl apply -f secret.yaml -n backend-namespace-jesusramirez\r"
          send "kubectl apply -f deployment.yaml -n backend-namespace-jesusramirez\r"
          send "kubectl apply -f service.yaml -n backend-namespace-jesusramirez\r"
          send "kubectl apply -f cronjob-backup.yaml -n backend-namespace-jesusramirez\r"
          send "exit\r"
          expect eof
          EOF

      - name: Esperar a que los pods estén listos
        run: |
          expect <<EOF
          spawn ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@204.48.22.13
          expect "Enter passphrase for key"
          send "${{ secrets.SSH_PASSPHRASE }}\r"
          expect "#"
          send "kubectl rollout status deployment/backend-api-jesusramirez -n backend-namespace-jesusramirez\r"
          send "exit\r"
          expect eof
          EOF

      - name: Verificar estado de los pods en Kubernetes usando `expect`
        run: |
          expect <<EOF
          spawn ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@204.48.22.13 "kubectl get pods -n backend-namespace-jesusramirez"
          expect "Enter passphrase for key"
          send "${{ secrets.SSH_PASSPHRASE }}\r"
          expect eof
          EOF
