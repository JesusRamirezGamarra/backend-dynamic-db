name: Deploy Backend to Kubernetes

on:
  push:
    branches:
      - develop  # 🚀 Se ejecutará cuando haya cambios en la rama "develop"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar `expect`
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Configurar SSH y conectar al servidor
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -t rsa 204.48.22.13 >> ~/.ssh/known_hosts

      - name: Probar conexión SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@204.48.22.13 "echo Conexión SSH exitosa"

      - name: Crear directorios en el servidor si no existen
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@204.48.22.13 <<EOF
          mkdir -p /root/codigo/jesusramirez/backend-dynamic-db/k8s
          mkdir -p /root/codigo/jesusramirez/docker
          EOF

      - name: Sincronizar archivos Kubernetes con el servidor
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" ./k8s/ root@204.48.22.13:/root/codigo/jesusramirez/backend-dynamic-db/k8s

      - name: Verificar archivos sincronizados en el servidor
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@204.48.22.13 "ls -l /root/codigo/jesusramirez/backend-dynamic-db/k8s/"

      - name: Sincronizar nuevo `docker-compose.yml` con el servidor
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" ./docker-compose.yml root@204.48.22.13:/root/codigo/jesusramirez/docker/docker-compose.yml

      - name: Desplegar en Kubernetes en Digital Ocean
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@204.48.22.13 <<EOF
          set -e
          cd /root/codigo/jesusramirez/backend-dynamic-db/k8s
          kubectl apply -f namespace.yaml
          kubectl apply -f configmap.yaml -n backend-namespace-jesusramirez
          kubectl apply -f secret.yaml -n backend-namespace-jesusramirez
          kubectl apply -f deployment.yaml -n backend-namespace-jesusramirez
          kubectl apply -f service.yaml -n backend-namespace-jesusramirez
          kubectl apply -f cronjob-backup.yaml -n backend-namespace-jesusramirez
          EOF

      - name: Esperar a que los pods estén listos
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@204.48.22.13 "kubectl rollout status deployment/backend-api-jesusramirez -n backend-namespace-jesusramirez"

      - name: Verificar estado de los pods en Kubernetes
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@204.48.22.13 "kubectl get pods -n backend-namespace-jesusramirez"
