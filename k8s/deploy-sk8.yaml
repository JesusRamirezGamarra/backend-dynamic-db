          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: backend-config-jesusramirez
                key: DATABASE_HOST      
          - name: DB_USER_NAME
            valueFrom:
              secretKeyRef:
                name: backend-secrets-jesusramirez
                key: DATABASE_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: backend-secrets-jesusramirez
                key: DATABASE_PASSWORD
          - name: DB_NAME
            value: testdb
          - name: DB_PORT
            value: "3306"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: backend-secrets-jesusramirez
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: backend-secrets-jesusramirez
                key: AWS_SECRET_ACCESS_KEY
      imagePullSecrets:
        - name: regcred   
