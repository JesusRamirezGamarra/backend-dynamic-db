apiVersion: v1
kind: Namespace
metadata:
  name: backend-namespace-jesusramirez
---

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets-jesusramirez
  namespace: backend-namespace-jesusramirez
type: Opaque
data:
  DATABASE_USER: cm9vdA==  # "root" codificado en base64
  DATABASE_PASSWORD: MTIzNDU2  # "123456" codificado en base64

---

#ConfigMap :  backend-config-jesusramirez
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config-jesusramirez
  namespace: backend-namespace-jesusramirez
data:
  DATABASE_HOST: mysql-service
  DATABASE_PORT: "3306"
  APP_ENV: "production"
  LOG_LEVEL: "info"
---

#Deployment :  mysql-deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: backend-namespace-jesusramirez
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:5.7
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets-jesusramirez
                  key: DATABASE_PASSWORD
            - name: MYSQL_DATABASE
              value: testdb
          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d  # Monta el script en el directorio correcto para MySQL              
          ports:
            - containerPort: 3306
      volumes:
        - name: init-script
          configMap:
            name: mysql-init-script  # Este es el ConfigMap que contiene el script SQL            
---

apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: backend-namespace-jesusramirez
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None  # Esto crea un servicio sin balanceo de carga, lo que es apropiado para MySQL
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: backend-namespace-jesusramirez
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
