apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: backend-namespace-jesusramirez
spec:
  type: LoadBalancer  # Para acceso externo (si es en la nube como AWS, GCP, etc.)
  selector:
    app: backend  # El servicio selecciona los pods etiquetados con "app=backend"
  ports:
  - port: 80
    protocol: TCP
    targetPort: 3000
---

apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup-mysql
  namespace: backend-namespace-jesusramirez
spec:
  schedule: "*/5 * * * *"  # Ejecutar cada 5 minutos
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: db-backup
              # image: jesusramirezgamarra/backend-dynamic-db:latest  # Imagen en Docker Hub
              # image: amazonlinux:latest
              image: jesusramirezgamarra/mysql-backup:latest
              envFrom:
                - secretRef:
                    name: backend-secrets-jesusramirez              
              env:
                - name: DB_TYPE
                  value: "MYSQL"  # Se define que solo se respaldará MySQL por ahora
                - name: DB_NAME
                  value: "testdb"  # Nombre de la base de datos (en este caso, "testdb")
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backend-secrets-jesusramirez
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backend-secrets-jesusramirez
                      key: AWS_SECRET_ACCESS_KEY
                - name: MYSQL_USER
                  valueFrom:
                    secretKeyRef:
                      name: backend-secrets-jesusramirez
                      key: DATABASE_USER
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-secrets-jesusramirez
                      key: DATABASE_PASSWORD
                - name: MYSQL_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: backend-config-jesusramirez
                      key: DATABASE_HOST                     
                    # secretKeyRef:
                    #   name: backend-secrets-jesusramirez
                    #   key: MYSQL_HOST
                - name: MYSQL_PORT
                  value: "3306"  # Puerto de MySQL
              command: ["/usr/local/bin/backup-scripts/backup-script.sh"]
              args:
                - "$(DB_NAME)"   # Base de datos (nombre) : testdb
                - "$(DB_TYPE)"   # Tipo de base de datos (MYSQL, POSTGRES, MONGODB)
          restartPolicy: OnFailure



---
