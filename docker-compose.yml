version: '3.8'

services:
  mysql-db:
    image: mysql:latest
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: testdb
      # MYSQL_USER: root
      # MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./data/mysql_data.sql:/docker-entrypoint-initdb.d/init.sql      
    networks:
      - backend-network
  backend-api:
    image: jesusramirezgamarra/backend-dynamic-db:latest
    container_name: backend-api
    restart: always
    depends_on:
      - mysql-db
    environment:
      MY_DATABASE_DRIVER: mysql
      DB_HOST: mysql-db
      DB_USER_NAME: root
      DB_PASSWORD: 123456
      DB_NAME: testdb
      DB_PORT: 3306
    ports:
      - "3000:3000"
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  mysql-data: