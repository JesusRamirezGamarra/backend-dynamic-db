version: '3.8'

services:
  mysql-db-jesusramirez:
    image: mysql:latest
    container_name: mysql-db-jesusramirez
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: testdb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data-jesusramirez:/var/lib/mysql
      - ./data/mysql_data.sql:/docker-entrypoint-initdb.d/init.sql      
    networks:
      - backend-network-jesusramirez

  backend-api-jesusramirez:
    image: jesusramirezgamarra/backend-dynamic-db:latest
    container_name: backend-api-jesusramirez
    restart: always
    depends_on:
      - mysql-db-jesusramirez
    environment:
      MY_DATABASE_DRIVER: mysql
      DB_HOST: mysql-db-jesusramirez
      DB_USER_NAME: root
      DB_PASSWORD: 123456
      DB_NAME: testdb
      DB_PORT: 3306
    ports:
      - "3000:3000"
    networks:
      - backend-network-jesusramirez

networks:
  backend-network-jesusramirez:
    driver: bridge

volumes:
  mysql-data-jesusramirez:
